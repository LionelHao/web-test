# 安全组需开放80端口（HTTP）和443端口（HTTPS）
server {
    listen 80;
    server_name your_domain.com;  # 替换实际域名
    
    # 补充安全头
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    
    # 静态资源缓存
    location /static {
        expires 1y;
        access_log off;
    }
}